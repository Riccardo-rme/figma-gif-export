<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame to GIF — icon</title>
<style>
  /* The GIF tile from cover.html, isolated. Drawn at 560px and scaled to ?size= */
  :root {
    --charcoal: #221F20;
    --coral: #FB635C;
    --brand-gradient:
      radial-gradient(120% 90% at 0% 0%, #4CA8B8 0%, transparent 55%),
      radial-gradient(90% 80% at 0% 100%, #143353 0%, transparent 70%),
      radial-gradient(90% 90% at 100% 100%, #EC5A5C 0%, transparent 70%),
      radial-gradient(80% 70% at 100% 0%, #F3E4E6 0%, transparent 65%),
      linear-gradient(135deg, #3B84BA 0%, #6A4560 55%, #E8535A 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: "Adrianna Extended", "Adrianna", sans-serif; }

  .gif {
    position: absolute; left: 0; top: 0; width: 560px; height: 560px; border-radius: 32px;
    background: var(--brand-gradient); overflow: hidden; transform-origin: 0 0;
  }
  .gif .mark { position: absolute; width: 150px; height: 204px; top: 168px; }
  .gif .mark svg { width: 100%; height: 100%; display: block; }
  .badge {
    position: absolute; left: 32px; top: 32px; padding: 10px 18px; border-radius: 999px;
    background: #fff; color: var(--charcoal); font-weight: 700; font-size: 20px; letter-spacing: .14em;
    display: flex; align-items: center; gap: 10px;
  }
  .badge::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
  .timeline { position: absolute; left: 32px; right: 32px; bottom: 32px; display: flex; gap: 8px; }
  .timeline span { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.28); }
  .timeline span.on { background: #fff; }

  /* ?simple=1 — small sizes: no badge or timeline, bigger and more visible R trail */
  .simple .badge, .simple .timeline { display: none; }
  .simple .mark { width: 202px; height: 276px; top: 142px; }
  .simple .mark:nth-of-type(2) { left: 69px !important; opacity: .2 !important; }
  .simple .mark:nth-of-type(3) { left: 179px !important; opacity: .42 !important; }
  .simple .mark:nth-of-type(4) { left: 289px !important; }
</style>
</head>
<body>
  <!-- Brand monogram, traced from _MY BRAND.ai (artboard 2) -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="r" viewBox="-30.97 -34.184 38.331 52.019">
        <path transform="scale(1,-1)" d="M0 0C-.484 1.184-1.121 2.351-1.868 3.426 2.637 6.279 5.1 10.909 5.1 16.591 5.1 27.936-2.537 34.184-16.406 34.184-20.761 34.184-25.53 33.506-30.199 32.225L-30.97 32.014V-14.211C-28.007-15.773-24.828-16.978-21.489-17.775V.181H-16.037C-11.528.181-9.943-.679-8.659-3.825L-2.948-17.835H7.361Z"/>
      </symbol>
    </defs>
  </svg>

  <!-- Same tile as the cover; the R trail is re-centred since nothing overlaps it here -->
  <div class="gif" id="tile">
    <div class="badge">GIF</div>
    <div class="mark" style="left:115px;opacity:.12"><svg fill="#fff"><use href="#r"/></svg></div>
    <div class="mark" style="left:205px;opacity:.3"><svg fill="#fff"><use href="#r"/></svg></div>
    <div class="mark" style="left:295px"><svg fill="#fff"><use href="#r"/></svg></div>
    <div class="timeline"><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const size = Number(params.get('size')) || 560;
    if (params.get('simple')) document.body.classList.add('simple');
    document.documentElement.style.width = document.documentElement.style.height = size + 'px';
    document.getElementById('tile').style.transform = `scale(${size / 560})`;
  </script>
</body>
</html>
